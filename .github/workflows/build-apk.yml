name: Build ImageSeek APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create folders
        run: |
          mkdir -p app/src/main/java/com/example/imageseek
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

      - name: Copy Android files
        run: |
          cp app__build.gradle app/build.gradle
          cp app__src__main__AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app__src__main__java__com__example__imageseek__MainActivity.java app/src/main/java/com/example/imageseek/MainActivity.java

      - name: Create settings
        run: |
          printf '%s\n' 'pluginManagement {' '    repositories {' '        google()' '        mavenCentral()' '        gradlePluginPortal()' '    }' '}' '' 'dependencyResolutionManagement {' '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' '    repositories {' '        google()' '        mavenCentral()' '    }' '}' '' 'rootProject.name = "ImageSeek"' 'include(":app")' > settings.gradle

      - name: Create root Gradle file
        run: |
          printf '%s\n' 'plugins {' '    id "com.android.application" version "8.7.2" apply false' '}' > build.gradle

      - name: Create resources
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <color name="purple_500">#6750A4</color>' '    <color name="purple_700">#4F378B</color>' '    <color name="white">#FFFFFF</color>' '</resources>' > app/src/main/res/values/colors.xml

          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' '    <style name="Theme.ImageSeek" parent="android:style/Theme.Material.Light.NoActionBar">' '        <item name="android:fontFamily">sans</item>' '        <item name="android:colorAccent">@color/purple_500</item>' '    </style>' '</resources>' > app/src/main/res/values/themes.xml

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImageSeek-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
